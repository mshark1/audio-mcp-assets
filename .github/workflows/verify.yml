name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install numpy scipy soundfile pyloudnorm
      - name: Independent ground-truth check (no audio-mcp code)
        run: python tools/verify_independent.py reference-signals
      - name: Resemblance check against famous jingles and sound marks
        run: python tools/similarity_check.py sfx-retro-ui
      - name: Every manifest check passed when the pack was built
        run: |
          python - <<'PY'
          import json, sys
          bad = [f"{pack}/{a['file']}: {r['measure']}" for pack in ("reference-signals", "sfx-retro-ui")
                 for a in json.load(open(f"{pack}/manifest.json", encoding="utf-8"))["assets"]
                 for r in a["verification"] if not r["pass"]]
          print("\n".join(bad) or "all manifest checks passed")
          sys.exit(1 if bad else 0)
          PY
